# Pipeline profiles: which stages run, in which order, with which settings.
# Configuration, not code: a new profile is a new block here.

profiles:
  news_piper:
    project: news
    stages:
      - fetch
      - clean
      - normalize
      - residue_check
      - select_items
      - tts_piper
      - postprocess
    params:
      feeds: config/feeds.yaml
      whitelist: config/rundung_whitelist.json
      lexicon: config/aussprache_lexikon.json
      max_items: 20
      voice: voices/de_DE-thorsten-high.onnx

  # The test sentence: fixed problem cases, spoken through the same stages.
  # No fetch, clean or select_items: every case is spoken, in a fixed order.
  testsatz_piper:
    project: testsatz
    stages:
      - normalize
      - residue_check
      - tts_piper
      - postprocess
    params:
      input: tests/testsatz.json
      whitelist: config/rundung_whitelist.json
      lexicon: config/aussprache_lexikon.json
      voice: voices/de_DE-thorsten-high.onnx

  # Phase 2, step by step: the new chain up to classify.
  # select_items, script and factcheck follow once they read the classify file.
  news_classify:
    project: news
    stages:
      - fetch
      - clean
      - classify
      - select_items
    params:
      feeds: config/feeds.yaml
      categories: config/categories.json
      classify_prompt: prompts/classify_prompt.md
      model: gemini-3.5-flash-lite
      batch_size: 5
      timeout_ms: 30000
      attempts: 3
      temperature: 0.0
      min_interval_s: 5.0
      max_items: 10
